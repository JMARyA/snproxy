[package]
name = "snterra"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "terraform-provider-snterra"
path = "src/main.rs"

[dependencies]
tf-provider = { git = "https://github.com/aneoconsulting/tf-provider" }
tokio        = { version = "1", features = ["full"] }
async-trait  = "0.1"
anyhow       = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
